# -----------------------------------------------------------------------------
# Compila o jogo para Windows, Linux e Mac nos servidores do GitHub.
#
# - Ao criar uma tag que começa com "v" (ex.: v0.2), os três .zip são
#   publicados automaticamente na página de Releases.
# - Também dá para rodar manualmente na aba "Actions" (botão "Run workflow").
#   Preenchendo "versao" (ex.: v1.0), a versão é publicada nos Releases;
#   vazio, os arquivos ficam só como "artifacts" da execução.
#
# Os executáveis são estáticos: quem baixa só extrai e joga, sem instalar nada.
# -----------------------------------------------------------------------------
name: Compilar e publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Nome da versão a publicar (ex.: v1.0). Vazio = só compilar."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar MinGW (compila o .exe do Windows a partir do Linux)
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix

      - name: Compilar
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4 --target masmorra

      - name: Empacotar
        run: |
          mkdir -p Masmorra dist
          cp build/masmorra.exe Masmorra/
          zip -r dist/masmorra-windows.zip Masmorra

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  linux:
    runs-on: ubuntu-22.04   # glibc mais antiga = roda em mais distribuições
    steps:
      - uses: actions/checkout@v4

      - name: Instalar bibliotecas da janela (X11 e OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Compilar
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4 --target masmorra

      - name: Empacotar
        run: |
          mkdir -p Masmorra dist
          cp build/masmorra Masmorra/
          tar -czf dist/masmorra-linux.tar.gz Masmorra

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar (binário universal Intel + Apple Silicon)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --parallel 4 --target masmorra

      - name: Empacotar
        run: |
          mkdir -p Masmorra dist
          cp build/masmorra Masmorra/
          tar -czf dist/masmorra-mac.tar.gz Masmorra

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.tar.gz

      # O Mac às vezes demora na fila do GitHub: ele publica sozinho quando
      # terminar, sem atrasar os downloads de Windows e Linux.
      - name: Publicar versão do Mac
        if: startsWith(github.ref, 'refs/tags/') || inputs.versao != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.versao || github.ref_name }}
          files: dist/*.tar.gz

  publicar:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/') || inputs.versao != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.versao || github.ref_name }}
          name: Masmorra ${{ inputs.versao || github.ref_name }}
          body: |
            Baixe o arquivo do seu sistema, extraia e jogue. Não precisa instalar nada.
            - **Windows:** `masmorra-windows.zip` → dois cliques em `masmorra.exe`
            - **Linux:** `masmorra-linux.tar.gz` → `./masmorra`
            - **Mac:** `masmorra-mac.tar.gz` (aparece quando o GitHub terminar de compilar)
          files: dist/*
