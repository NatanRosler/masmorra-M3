# -----------------------------------------------------------------------------
# Compila o jogo para Windows, Linux e Mac nos servidores do GitHub.
#
# - Ao criar uma tag que começa com "v" (ex.: v0.1), os três .zip são
#   publicados automaticamente na página de Releases.
# - Também dá para rodar manualmente na aba "Actions" (botão "Run workflow");
#   nesse caso os .zip ficam disponíveis como "artifacts" da execução.
# -----------------------------------------------------------------------------
name: Compilar e publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-e-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar MinGW (compila o .exe do Windows a partir do Linux)
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix

      - name: Compilar para Linux
        run: ./build.sh

      - name: Compilar para Windows
        run: x86_64-w64-mingw32-g++-posix -std=c++17 -O2 -Wall -Wextra -static -o masmorra.exe src/*.cpp

      - name: Empacotar
        run: |
          mkdir -p dist
          zip -j dist/masmorra-linux.zip masmorra README.md
          zip -j dist/masmorra-windows.zip masmorra.exe README.md

      - uses: actions/upload-artifact@v4
        with:
          name: linux-e-windows
          path: dist/*.zip

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar para Mac (binário universal Intel + Apple Silicon)
        run: ./build.sh

      - name: Empacotar
        run: |
          mkdir -p dist
          zip -j dist/masmorra-mac.zip masmorra README.md

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.zip

  publicar:
    needs: [linux-e-windows, mac]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
